# ================================
# Server Configuration
# ================================
server.port=8080
server.address=127.0.0.1

# ================================
# MySQL Database Configuration
# (switched from PostgreSQL — MySQL 8.0 is already running on this machine)
# ================================
spring.datasource.url=jdbc:mysql://localhost:3306/coffee_shop_db?useSSL=false&serverTimezone=Asia/Colombo&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:1234}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ================================
# JPA / Hibernate Configuration
# ================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
# Dialect is auto-detected by Hibernate 6 — no need to set it explicitly
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ================================
# File Upload Configuration
# ================================
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# ================================
# JWT Configuration
# ================================
# JWT secret is resolved at runtime:
# 1. Environment variable JWT_SECRET
# 2. File jwt_secret.txt in working directory
# 3. Ephemeral random secret (logged warning)
jwt.expiration-ms=86400000

# ================================
# Logging
# ================================
logging.level.root=INFO
logging.level.com.coffeeshop=INFO
logging.level.org.springframework.security=INFO
